<!DOCTYPE html>
<html lang="tr" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Storyteller Magic</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;700;800&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" />

    <!-- Tailwind CSS (non-blocking on mobile) -->
    <script>
      window.tailwind = window.tailwind || {};
      window.tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              display: ['Manrope', 'sans-serif'],
              serif: ['"Noto Serif"', 'serif'],
            },
            colors: {
              primary: '#ee8c2b', // Orange/Peach highlight
              secondary: '#7f13ec', // Purple highlight
              'bg-dark': '#111121', // Deep night background
              'bg-card': '#1a1625', // Slightly lighter card bg
              'accent-peach': '#ffb38a',
              'accent-lavender': '#9d9ade',
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'spin-slow': 'spin 8s linear infinite',
            },
            backgroundImage: {
              'magic-gradient': 'linear-gradient(180deg, #111121 0%, #2D1B4D 50%, #111121 100%)',
              'star-dust': 'radial-gradient(circle, rgba(255,255,255,0.15) 1px, transparent 1px)',
            }
          }
        }
      }
    </script>
    <script defer src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        -webkit-tap-highlight-color: transparent;
        background-color: #111121;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      /* Custom scrollbar hiding */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      /* Custom color utilities — CDN Tailwind JIT fallback */
      .bg-bg-dark  { background-color: #111121 !important; }
      .bg-bg-card  { background-color: #1a1625 !important; }
      .text-primary { color: #ee8c2b !important; }
      .text-secondary { color: #7f13ec !important; }
      .border-primary { border-color: #ee8c2b !important; }
      .border-secondary { border-color: #7f13ec !important; }
      .bg-primary { background-color: #ee8c2b !important; }
      .bg-secondary { background-color: #7f13ec !important; }
      /* Opacity variants */
      .bg-bg-dark\/95 { background-color: rgba(17,17,33,0.95) !important; }
      .bg-bg-dark\/80 { background-color: rgba(17,17,33,0.80) !important; }
      .bg-bg-dark\/50 { background-color: rgba(17,17,33,0.50) !important; }
      .bg-primary\/20 { background-color: rgba(238,140,43,0.20) !important; }
      .bg-secondary\/20 { background-color: rgba(127,19,236,0.20) !important; }
      .border-primary\/30 { border-color: rgba(238,140,43,0.30) !important; }
      .text-primary\/80 { color: rgba(238,140,43,0.80) !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
